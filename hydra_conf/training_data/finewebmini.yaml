training_params:
  # tokens_processed must be divisible by (world size * batch size * token length)
  tokens_processed: 262144 # 2^18  # 524288 # 2^19
  batch_size: 32
  num_epochs: 1
  context_length: 1024
  gradnorm: 1.0
  tensorcore_precision: high   #Can be highest, high, or medium
  autocast: True
  mixed_precision: bfloat16
  compile: True

dataset:
  name: "finewebmini"