training_params:
  tokens_processed: 524288 # 2^19
  val_tokens_processed: 8388608 #2^23
  batch_size: 16
  num_epochs: 1
  context_length: 1024
  gradnorm: 1.0
  tensorcore_precision: highest   #Can be highest, high, or medium
  autocast: True
  mixed_precision: bfloat16
  compile: True
  mb_subsampling: null
  max_steps: null
  global_batch_size: ${div:${.tokens_processed}, ${.context_length}}
