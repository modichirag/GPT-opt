# config.yaml
optimizer_params:
  - name: adamw
    lr: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05]
    weight_decay: 0.0
    lr_schedule: warm-up-constant-linear
    warm_up_fraction: 0.1
    cool_down_fraction: 0.0

  - name: iams
    lr: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.3]  # 0.05
    weight_decay: 0.0
    lr_schedule: warm-up-constant-linear
    warm_up_fraction: 0.1
    cool_down_fraction: 0.0

  - name: sgd-schedulep
    lr: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.3]  # 0.05
    weight_decay: 0.0
    lr_schedule: warm-up-constant-linear
    warm_up_fraction: 0.1
    cool_down_fraction: 0.0

  - name: sgd-schedulefree
    lr: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.3]  # 0.05
    weight_decay: 0.0
    lr_schedule: warm-up-constant-linear
    warm_up_fraction: 0.1
    cool_down_fraction: 0.0


  - name: adamw-schedulep 
    lr: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.3]
    weight_decay: 0.0
    lr_schedule: warm-up-constant-linear
    warm_up_fraction: 0.1
    cool_down_fraction: 0.0

  - name: adamw-schedulefree
    lr: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.3]
    weight_decay: 0.0
    lr_schedule: warm-up-constant-linear
    warm_up_fraction: 0.1
    cool_down_fraction: 0.0
    
  - name: iams-adam
    lr: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1]  # 0.05
    weight_decay: 0.0
    lr_schedule: warm-up-constant-linear
    warm_up_fraction: 0.1
    cool_down_fraction: 0.0

  - name: sgd-m
    lr: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05]  # 0.05
    weight_decay: 0.0
    lr_schedule: warm-up-constant-linear
    warm_up_fraction: 0.1
    cool_down_fraction: 0.0
  
teacher_model: "EleutherAI/gpt-neo-2.7B" # "gpt2-xl" # "EleutherAI/gpt-neo-1.3B" # "EleutherAI/gpt-neo-2.7B" # "EleutherAI/gpt-j-6B"

training_params:
  tokens_processed: 262144 # 2^18  # 524288 # 2^19
  val_tokens_processed: 8388608 #2^23
  batch_size: 32
  num_epochs: 1
  context_length: 1024
  gradnorm: 1.0
  tensorcore_precision: high   #Can be highest, high, or medium
  autocast: True
  mixed_precision: bfloat16
  compile: True

logging_params:
  val_tokens_processed: 8388608 #2^23
  log_step: 50
  val_step: 50
  save_ckpt_step: 100
  load_ckpt_step: 0
  keep_last: 2
  ckpt_dir: "" #/mnt/ceph/users/cmodi/gptopt/

gpt_model:
  n_embd: 768    
  n_layer: 12   
  n_head: 12    
  vocab_size: 50257
  flash_attention: True

dataset:
  name: "fineweb1B"