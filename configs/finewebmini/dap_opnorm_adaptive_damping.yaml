# Sweep LR for DAPOpNorm with adaptive damping targeting opnorm
# delta is set each step to maintain ||C_eff^{-1/2}||_op = opnorm_target
optimizer_params:
  - name: dap-opnorm
    lr: [0.01, 0.02, 0.03, 0.05, 0.07]
    weight_decay: 0.1
    momentum: 0.95
    ns_steps: 5
    lr_schedule: warm-up-cosine
    warm_up_fraction: 0.1
    damping: 0.03
    opnorm_target: 2.0

training_params:
  tokens_processed: 262144
  val_tokens_processed: 8388608
  batch_size: 8
  num_epochs: 1
  context_length: 1024
  gradnorm: 1.0
  tensorcore_precision: highest
  autocast: True
  mixed_precision: bfloat16
  compile: True

logging_params:
  val_tokens_processed: 8388608
  log_step: 50
  val_step: 50
  save_ckpt_step: 100
  load_ckpt_step: 0
  keep_last: 2
  ckpt_dir: ""

gpt_model:
  n_embd: 256
  n_layer: 2
  n_head: 4
  vocab_size: 50257
  flash_attention: True

dataset:
  name: "finewebmini"
